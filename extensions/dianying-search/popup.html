<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h3>DianYing 癫影搜索</h3>
    <p class="hint">输入关键词，选择类型在癫影中搜索</p>
    <div class="form-row search-row">
      <input type="text" id="keywordInput" placeholder="影视、动漫关键词...">
    </div>
    <div class="form-row kind-row">
      <button id="searchMovieBtn" class="kind-btn">电影</button>
      <button id="searchTvBtn" class="kind-btn">剧集</button>
      <button id="searchAnimeBtn" class="kind-btn">动漫</button>
    </div>
    <div id="status" class="status hidden"></div>

    <div class="divider"></div>

    <div class="form-group">
      <label>搜索主页地址</label>
      <div class="form-row">
        <input type="text" id="baseUrlInput" placeholder="https://m.dian115.com">
        <button id="saveBtn" class="secondary">保存</button>
      </div>
    </div>

    <div class="actions">
      <button id="resetBtn" class="link-btn">恢复默认地址</button>
    </div>
  </div>
  <script src="search-url.js"></script>
  <script src="popup.js"></script>
</body>
</html>
