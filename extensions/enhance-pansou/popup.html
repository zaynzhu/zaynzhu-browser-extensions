<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h3>盘搜～观影增强</h3>
    <p class="hint">配置观影站与盘搜服务地址</p>

    <div class="form-group">
      <label>观影站地址</label>
      <div class="form-row">
        <input type="text" id="siteUrlInput" placeholder="https://www.xn--wcv59z.com">
      </div>
    </div>

    <div class="form-group">
      <label>盘搜服务地址</label>
      <div class="form-row">
        <input type="text" id="pansouUrlInput" placeholder="http://192.168.50.233:4805">
        <button id="saveBtn">保存</button>
      </div>
    </div>

    <div id="status" class="status hidden"></div>
    <div class="actions">
      <button id="resetBtn" class="link-btn">恢复默认</button>
      <button id="optionsBtn" class="link-btn">高级设置</button>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
